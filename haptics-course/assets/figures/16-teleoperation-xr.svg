<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">XR co-registration and bilateral teleoperation</title><desc id="desc">The upper panel shows tracked hand, virtual object, haptic contact, and spatial-temporal error in XR. The lower panel shows a human operator, master device, network delay, remote robot and environment, with force and motion channels and a local model-mediated path.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#215f5a"/></marker><style>.bg{fill:#fffdf8}.p{fill:#f5f2ea;stroke:#c9c7be;stroke-width:2}.g{fill:#dce7df;stroke:#215f5a;stroke-width:2}.r{fill:#f3d8cf;stroke:#a73d2c;stroke-width:2}.b{fill:#dbe6ee;stroke:#40677a;stroke-width:2}.line{stroke:#215f5a;stroke-width:4;fill:none;marker-end:url(#a)}.back{stroke:#a73d2c;stroke-width:4;fill:none;marker-end:url(#a)}.dash{stroke:#a73d2c;stroke-width:3;stroke-dasharray:8 7}.h{font:700 27px Georgia,serif;fill:#152421}.t{font:700 17px system-ui,sans-serif;fill:#152421}.s{font:14px system-ui,sans-serif;fill:#5d6864}.e{font:800 15px system-ui,sans-serif;letter-spacing:2px;fill:#a73d2c}</style></defs><rect class="bg" width="1200" height="780" rx="28"/><text x="55" y="58" class="e">SPATIAL AND TEMPORAL CORRESPONDENCE DEFINE PLAUSIBLE REMOTE CONTACT</text><g transform="translate(55 95)"><text x="0" y="0" class="h">XR contact</text><rect class="p" x="0" y="30" width="500" height="260" rx="22"/><path d="M65 180c45-80 95-88 143-40 32 32 74 28 110 5l58 90H70z" fill="#e8b8a8"/><circle cx="360" cy="135" r="65" fill="#dbe6ee" stroke="#40677a" stroke-width="4"/><line class="dash" x1="320" y1="190" x2="385" y2="155"/><circle cx="320" cy="190" r="12" fill="#d95d45"/><circle cx="385" cy="155" r="12" fill="#215f5a"/><text x="40" y="55" class="t">tracked hand</text><text x="350" y="55" class="t">visual object</text><text x="275" y="240" class="s">red: physical or rendered haptic point</text><text x="275" y="264" class="s">green: intended visual contact</text><rect class="r" x="540" y="30" width="550" height="260" rx="22"/><text x="565" y="70" class="t">Co-registration error budget</text><text x="565" y="108" class="s">tracking calibration + hand model + device geometry</text><text x="565" y="136" class="s">+ display latency + actuator latency + motion speed</text><text x="565" y="174" class="t">First-order dynamic error</text><text x="565" y="212" class="h">e ≈ vτ</text><text x="565" y="248" class="s">Physical and perceptual alignment should be reported separately.</text></g><g transform="translate(55 455)"><text x="0" y="0" class="h">Bilateral teleoperation</text><rect class="r" x="0" y="40" width="150" height="150" rx="20"/><text x="75" y="92" text-anchor="middle" class="t">Human</text><text x="75" y="122" text-anchor="middle" class="s">motion + force</text><path class="line" d="M160 85h55"/><path class="back" d="M215 145h-55"/><rect class="g" x="225" y="40" width="170" height="150" rx="20"/><text x="310" y="92" text-anchor="middle" class="t">Master device</text><text x="310" y="122" text-anchor="middle" class="s">local haptic loop</text><path class="line" d="M405 85h90"/><path class="back" d="M495 145h-90"/><rect class="b" x="505" y="25" width="180" height="180" rx="20"/><text x="595" y="78" text-anchor="middle" class="t">Communication</text><text x="595" y="108" text-anchor="middle" class="s">delay · jitter</text><text x="595" y="132" text-anchor="middle" class="s">loss · limited rate</text><text x="595" y="167" text-anchor="middle" class="t">stability constraint</text><path class="line" d="M695 85h70"/><path class="back" d="M765 145h-70"/><rect class="g" x="775" y="40" width="170" height="150" rx="20"/><text x="860" y="92" text-anchor="middle" class="t">Remote robot</text><text x="860" y="122" text-anchor="middle" class="s">sensors + control</text><path class="line" d="M955 85h55"/><path class="back" d="M1010 145h-55"/><rect class="p" x="1020" y="40" width="125" height="150" rx="20"/><text x="1082" y="92" text-anchor="middle" class="t">World</text><text x="1082" y="122" text-anchor="middle" class="s">contact</text><path class="dash" d="M775 220c-170 90-390 90-550 0"/><text x="500" y="280" text-anchor="middle" class="s">A local model can render predicted contact while remote updates correct the state.</text></g><text x="600" y="750" text-anchor="middle" class="s">Transparency, stability, task performance, trust, and safety must be evaluated together; perfect force reproduction is rarely achievable under delay.</text></svg>