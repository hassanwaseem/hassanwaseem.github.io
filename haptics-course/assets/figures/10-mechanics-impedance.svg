<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Mass spring damper model and impedance interpretation</title><desc id="desc">A mass connected to a spring and damper is acted on by an external force. Equations relate force to acceleration velocity and displacement, and a lower panel compares free motion, compliant contact, and stiff constrained contact.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#a73d2c"/></marker><style>.bg{fill:#fffdf8}.p{fill:#f5f2ea;stroke:#c9c7be;stroke-width:2}.g{fill:#dce7df;stroke:#215f5a;stroke-width:2}.r{fill:#f3d8cf;stroke:#a73d2c;stroke-width:2}.ink{stroke:#152421;stroke-width:5;fill:none}.arr{stroke:#a73d2c;stroke-width:5;fill:none;marker-end:url(#a)}.h{font:700 28px Georgia,serif;fill:#152421}.t{font:700 20px system-ui,sans-serif;fill:#152421}.b{font:16px system-ui,sans-serif;fill:#5d6864}.e{font:800 15px system-ui,sans-serif;letter-spacing:2px;fill:#a73d2c}.eq{font:24px Georgia,serif;fill:#152421}</style></defs><rect class="bg" width="1200" height="760" rx="28"/><text x="55" y="58" class="e">MECHANICS CONNECTS MOTION TO FORCE</text><g transform="translate(60 105)"><rect class="p" width="1080" height="310" rx="25"/><line class="ink" x1="70" y1="245" x2="1010" y2="245"/><rect class="g" x="440" y="110" width="210" height="130" rx="20"/><text x="545" y="170" text-anchor="middle" class="h">mass m</text><text x="545" y="205" text-anchor="middle" class="b">position x(t)</text><path class="ink" d="M80 150h50l20-38 30 76 30-76 30 76 30-76 30 76 22-38h128"/><text x="210" y="95" text-anchor="middle" class="t">spring k</text><path class="ink" d="M650 168h85v-45h58v90h-58v-45"/><line class="ink" x1="793" y1="168" x2="1000" y2="168"/><text x="785" y="95" text-anchor="middle" class="t">damper b</text><path class="arr" d="M370 175h60"/><text x="365" y="153" text-anchor="end" class="t">F(t)</text><text x="545" y="285" text-anchor="middle" class="eq">F(t) = m ẍ + b ẋ + kx</text></g><text x="60" y="470" class="h">Mechanical impedance is a relationship, not a material label</text><g transform="translate(60 505)"><rect class="p" width="330" height="185" rx="22"/><text x="25" y="43" class="t">Free motion</text><text x="25" y="78" class="b">Low opposing force for movement.</text><text x="25" y="108" class="b">Device inertia and friction dominate.</text><text x="25" y="151" class="eq">Z = F / v</text><rect class="g" x="375" width="330" height="185" rx="22"/><text x="400" y="43" class="t">Compliant contact</text><text x="400" y="78" class="b">Force rises gradually with displacement.</text><text x="400" y="108" class="b">Stored energy returns on release.</text><text x="400" y="151" class="eq">F ≈ kx + bv</text><rect class="r" x="750" width="330" height="185" rx="22"/><text x="775" y="43" class="t">Stiff constraint</text><text x="775" y="78" class="b">Small motion should create large force.</text><text x="775" y="108" class="b">Sampling and delay limit stable stiffness.</text><text x="775" y="151" class="eq">k_rendered ≤ k_stable</text></g></svg>