<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Actuator selection map for haptic interfaces</title><desc id="desc">Actuator families are positioned by dominant output and bandwidth, with notes on force, displacement, size, power, and typical applications. A selection funnel links target percept to physical stimulus, actuator, transmission, and validation.</desc><defs><style>.bg{fill:#fffdf8}.p{fill:#f5f2ea;stroke:#c9c7be;stroke-width:2}.g{fill:#dce7df;stroke:#215f5a;stroke-width:2}.r{fill:#f3d8cf;stroke:#a73d2c;stroke-width:2}.b{fill:#dbe6ee;stroke:#40677a;stroke-width:2}.a{fill:#f1e0b8;stroke:#9d752f;stroke-width:2}.axis{stroke:#152421;stroke-width:3}.dash{stroke:#c9c7be;stroke-width:2;stroke-dasharray:7 7}.h{font:700 27px Georgia,serif;fill:#152421}.t{font:700 17px system-ui,sans-serif;fill:#152421}.s{font:14px system-ui,sans-serif;fill:#5d6864}.e{font:800 15px system-ui,sans-serif;letter-spacing:2px;fill:#a73d2c}</style></defs><rect class="bg" width="1200" height="780" rx="28"/><text x="55" y="58" class="e">SELECT ACTUATORS FROM THE REQUIRED BODY-LEVEL STIMULUS</text><g transform="translate(85 100)"><line class="axis" x1="0" y1="430" x2="700" y2="430"/><line class="axis" x1="0" y1="430" x2="0" y2="0"/><text x="350" y="475" text-anchor="middle" class="t">Increasing usable bandwidth →</text><text x="-65" y="210" transform="rotate(-90 -65 210)" text-anchor="middle" class="t">Increasing force or displacement capability →</text><line class="dash" x1="230" y1="0" x2="230" y2="430"/><line class="dash" x1="470" y1="0" x2="470" y2="430"/><rect class="r" x="35" y="310" width="170" height="82" rx="17"/><text x="120" y="342" text-anchor="middle" class="t">ERM / LRA</text><text x="120" y="368" text-anchor="middle" class="s">compact vibration cues</text><rect class="g" x="250" y="255" width="180" height="95" rx="17"/><text x="340" y="290" text-anchor="middle" class="t">Voice coil</text><text x="340" y="316" text-anchor="middle" class="s">controlled transient</text><text x="340" y="337" text-anchor="middle" class="s">and broadband motion</text><rect class="b" x="500" y="315" width="165" height="82" rx="17"/><text x="582" y="347" text-anchor="middle" class="t">Piezoelectric</text><text x="582" y="373" text-anchor="middle" class="s">small motion, high rate</text><rect class="a" x="70" y="100" width="190" height="105" rx="17"/><text x="165" y="136" text-anchor="middle" class="t">Motor + linkage</text><text x="165" y="162" text-anchor="middle" class="s">force, displacement,</text><text x="165" y="184" text-anchor="middle" class="s">grounded or wearable</text><rect class="g" x="300" y="130" width="175" height="100" rx="17"/><text x="388" y="166" text-anchor="middle" class="t">Pneumatic</text><text x="388" y="192" text-anchor="middle" class="s">pressure and soft shape</text><rect class="r" x="510" y="145" width="165" height="100" rx="17"/><text x="592" y="181" text-anchor="middle" class="t">Ultrasound</text><text x="592" y="207" text-anchor="middle" class="s">remote localized force</text></g><g transform="translate(830 95)"><text x="0" y="0" class="h">Selection funnel</text><rect class="p" x="0" y="30" width="285" height="70" rx="16"/><text x="142" y="59" text-anchor="middle" class="t">1. Intended percept</text><text x="142" y="83" text-anchor="middle" class="s">event, pressure, force, texture</text><rect class="g" x="20" y="120" width="245" height="70" rx="16"/><text x="142" y="149" text-anchor="middle" class="t">2. Physical variable</text><text x="142" y="173" text-anchor="middle" class="s">F, x, a, strain, heat, flow</text><rect class="r" x="40" y="210" width="205" height="70" rx="16"/><text x="142" y="239" text-anchor="middle" class="t">3. Actuator family</text><text x="142" y="263" text-anchor="middle" class="s">output and dynamics</text><rect class="b" x="60" y="300" width="165" height="70" rx="16"/><text x="142" y="329" text-anchor="middle" class="t">4. Transmission</text><text x="142" y="353" text-anchor="middle" class="s">mounting and body</text><rect class="a" x="80" y="390" width="125" height="70" rx="16"/><text x="142" y="419" text-anchor="middle" class="t">5. Validate</text><text x="142" y="443" text-anchor="middle" class="s">measure + test</text></g><g transform="translate(70 625)"><rect class="p" width="1060" height="100" rx="20"/><text x="25" y="38" class="t">No actuator is “best” in isolation.</text><text x="25" y="68" class="s">Compare usable output at the body, bandwidth, rise time, controllability, reaction path, size, mass, power, heat, noise, safety, cost, and repeatability.</text></g></svg>