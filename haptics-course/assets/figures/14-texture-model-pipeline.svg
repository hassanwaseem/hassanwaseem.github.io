<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">From real texture interaction to haptic texture rendering</title><desc id="desc">A pipeline shows controlled scanning of a real surface, measurement of force acceleration position and sound, feature or model extraction, speed and force conditioning, device-specific rendering, and perceptual validation.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#215f5a"/></marker><style>.bg{fill:#fffdf8}.p{fill:#f5f2ea;stroke:#c9c7be;stroke-width:2}.g{fill:#dce7df;stroke:#215f5a;stroke-width:2}.r{fill:#f3d8cf;stroke:#a73d2c;stroke-width:2}.b{fill:#dbe6ee;stroke:#40677a;stroke-width:2}.line{stroke:#215f5a;stroke-width:4;fill:none;marker-end:url(#a)}.wave{stroke:#a73d2c;stroke-width:4;fill:none}.h{font:700 27px Georgia,serif;fill:#152421}.t{font:700 18px system-ui,sans-serif;fill:#152421}.s{font:14px system-ui,sans-serif;fill:#5d6864}.e{font:800 15px system-ui,sans-serif;letter-spacing:2px;fill:#a73d2c}</style></defs><rect class="bg" width="1200" height="760" rx="28"/><text x="55" y="58" class="e">TEXTURE IS GENERATED BY INTERACTION, NOT STORED AS ONE WAVEFORM</text><g transform="translate(45 95)"><rect class="p" x="0" y="0" width="205" height="220" rx="22"/><text x="102" y="42" text-anchor="middle" class="t">Controlled scan</text><path d="M28 160l18-18 18 15 18-30 18 25 18-10 18 20 18-35 18 24 20-14" stroke="#152421" stroke-width="5" fill="none"/><circle cx="75" cy="103" r="22" fill="#d95d45"/><path class="line" d="M48 75h100"/><text x="102" y="202" text-anchor="middle" class="s">speed · force · direction</text><path class="line" d="M215 110h35"/><rect class="g" x="260" y="0" width="205" height="220" rx="22"/><text x="362" y="42" text-anchor="middle" class="t">Measurements</text><path class="wave" d="M285 92c20-35 38 35 58 0s38 35 58 0"/><text x="362" y="132" text-anchor="middle" class="s">acceleration · force</text><text x="362" y="158" text-anchor="middle" class="s">position · sound · image</text><path class="line" d="M475 110h35"/><rect class="b" x="520" y="0" width="205" height="220" rx="22"/><text x="622" y="42" text-anchor="middle" class="t">Representation</text><text x="622" y="83" text-anchor="middle" class="s">physical parameters</text><text x="622" y="110" text-anchor="middle" class="s">spectra / filters</text><text x="622" y="137" text-anchor="middle" class="s">stochastic models</text><text x="622" y="164" text-anchor="middle" class="s">learned latent features</text><path class="line" d="M735 110h35"/><rect class="r" x="780" y="0" width="205" height="220" rx="22"/><text x="882" y="42" text-anchor="middle" class="t">Conditioning</text><text x="882" y="83" text-anchor="middle" class="s">scan speed</text><text x="882" y="110" text-anchor="middle" class="s">normal force</text><text x="882" y="137" text-anchor="middle" class="s">direction and location</text><text x="882" y="164" text-anchor="middle" class="s">object state</text><path class="line" d="M995 110h35"/><rect class="g" x="1040" y="0" width="120" height="220" rx="22"/><text x="1100" y="42" text-anchor="middle" class="t">Render</text><text x="1100" y="90" text-anchor="middle" class="s">force</text><text x="1100" y="117" text-anchor="middle" class="s">vibration</text><text x="1100" y="144" text-anchor="middle" class="s">friction</text><text x="1100" y="171" text-anchor="middle" class="s">sound</text></g><g transform="translate(70 410)"><text x="0" y="0" class="h">Three validation layers</text><rect class="p" x="0" y="35" width="330" height="190" rx="22"/><text x="25" y="76" class="t">1. Signal fidelity</text><text x="25" y="112" class="s">Does the rendered output match the</text><text x="25" y="136" class="s">target statistics under controlled</text><text x="25" y="160" class="s">speed, force, and device conditions?</text><rect class="g" x="365" y="35" width="330" height="190" rx="22"/><text x="390" y="76" class="t">2. Perceptual fidelity</text><text x="390" y="112" class="s">Can users match, discriminate, rank,</text><text x="390" y="136" class="s">or identify the rendered texture in</text><text x="390" y="160" class="s">comparison with suitable references?</text><rect class="r" x="730" y="35" width="330" height="190" rx="22"/><text x="755" y="76" class="t">3. Functional value</text><text x="755" y="112" class="s">Does texture feedback improve search,</text><text x="755" y="136" class="s">manipulation, material judgment, or</text><text x="755" y="160" class="s">another task-relevant outcome?</text></g><text x="600" y="700" text-anchor="middle" class="s">A model that predicts measured acceleration may still fail perceptually; a preferred effect may still fail to represent the intended material.</text></svg>