<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Evidence ladder and safety gates for haptics research</title><desc id="desc">An evidence ladder progresses from concept and bench prototype to physical characterization, perceptual validation, task performance, generalization and deployment. Safety gates for mechanical, electrical, thermal, acoustic, ergonomic, privacy and ethics checks run alongside the ladder.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#215f5a"/></marker><style>.bg{fill:#fffdf8}.p{fill:#f5f2ea;stroke:#c9c7be;stroke-width:2}.g{fill:#dce7df;stroke:#215f5a;stroke-width:2}.r{fill:#f3d8cf;stroke:#a73d2c;stroke-width:2}.b{fill:#dbe6ee;stroke:#40677a;stroke-width:2}.a{fill:#f1e0b8;stroke:#9d752f;stroke-width:2}.line{stroke:#215f5a;stroke-width:4;fill:none;marker-end:url(#a)}.h{font:700 27px Georgia,serif;fill:#152421}.t{font:700 17px system-ui,sans-serif;fill:#152421}.s{font:14px system-ui,sans-serif;fill:#5d6864}.e{font:800 15px system-ui,sans-serif;letter-spacing:2px;fill:#a73d2c}</style></defs><rect class="bg" width="1200" height="820" rx="28"/><text x="55" y="58" class="e">STRONG HAPTICS RESEARCH BUILDS EVIDENCE IN LAYERS</text><g transform="translate(55 95)"><text x="0" y="0" class="h">Evidence ladder</text><rect class="p" x="0" y="40" width="280" height="85" rx="18"/><text x="25" y="74" class="t">1. Research question</text><text x="25" y="101" class="s">construct, mechanism, task, scope</text><path class="line" d="M140 135v30"/><rect class="g" x="80" y="175" width="300" height="85" rx="18"/><text x="105" y="209" class="t">2. Prototype and feasibility</text><text x="105" y="236" class="s">controlled function; known operating range</text><path class="line" d="M230 270v30"/><rect class="b" x="160" y="310" width="320" height="85" rx="18"/><text x="185" y="344" class="t">3. Physical characterization</text><text x="185" y="371" class="s">force, motion, spectrum, latency, repeatability</text><path class="line" d="M320 405v30"/><rect class="r" x="240" y="445" width="340" height="85" rx="18"/><text x="265" y="479" class="t">4. Perceptual validation</text><text x="265" y="506" class="s">detection, discrimination, quality, uncertainty</text><path class="line" d="M410 540v30"/><rect class="a" x="320" y="580" width="360" height="85" rx="18"/><text x="345" y="614" class="t">5. Task and comparative evidence</text><text x="345" y="641" class="s">baselines, performance, workload, failures</text><path class="line" d="M500 675v30"/><rect class="p" x="400" y="715" width="380" height="70" rx="18"/><text x="425" y="748" class="t">6. Generalization and deployment</text><text x="425" y="772" class="s">new users, contexts, maintenance, real risks</text></g><g transform="translate(760 95)"><text x="0" y="0" class="h">Safety and ethics gates</text><rect class="r" y="40" width="385" height="85" rx="18"/><text x="25" y="73" class="t">Mechanical</text><text x="25" y="100" class="s">force, torque, pinch, impact, stored energy</text><rect class="a" y="140" width="385" height="85" rx="18"/><text x="25" y="173" class="t">Electrical and thermal</text><text x="25" y="200" class="s">isolation, current, breakdown, heating, burns</text><rect class="b" y="240" width="385" height="85" rx="18"/><text x="25" y="273" class="t">Acoustic and vibration exposure</text><text x="25" y="300" class="s">frequency, intensity, duration, harmonics, noise</text><rect class="g" y="340" width="385" height="85" rx="18"/><text x="25" y="373" class="t">Ergonomics and accessibility</text><text x="25" y="400" class="s">fit, pressure, fatigue, mobility, diverse bodies</text><rect class="p" y="440" width="385" height="85" rx="18"/><text x="25" y="473" class="t">Human-participant ethics</text><text x="25" y="500" class="s">consent, stopping rules, deception, vulnerable users</text><rect class="r" y="540" width="385" height="85" rx="18"/><text x="25" y="573" class="t">Data and AI responsibility</text><text x="25" y="600" class="s">privacy, bias, leakage, explainability, misuse</text><rect class="g" y="640" width="385" height="115" rx="18"/><text x="25" y="674" class="t">Gate rule</text><text x="25" y="704" class="s">Review risk before each new study stage.</text><text x="25" y="730" class="s">A safe bench test does not prove safe body use,</text><text x="25" y="752" class="s">and a safe short study does not prove deployment safety.</text></g></svg>