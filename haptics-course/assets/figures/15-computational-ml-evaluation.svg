<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Computational haptic modelling and machine-learning validation</title><desc id="desc">A pipeline moves from interaction data and object state to representations, model training, held-out evaluation, real-time rendering, physical output, and perceptual validation. A split diagram warns against leakage between training validation and test sets.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#215f5a"/></marker><style>.bg{fill:#fffdf8}.p{fill:#f5f2ea;stroke:#c9c7be;stroke-width:2}.g{fill:#dce7df;stroke:#215f5a;stroke-width:2}.r{fill:#f3d8cf;stroke:#a73d2c;stroke-width:2}.b{fill:#dbe6ee;stroke:#40677a;stroke-width:2}.a{fill:#f1e0b8;stroke:#9d752f;stroke-width:2}.line{stroke:#215f5a;stroke-width:4;fill:none;marker-end:url(#a)}.bad{stroke:#a73d2c;stroke-width:4;fill:none;stroke-dasharray:8 7}.h{font:700 27px Georgia,serif;fill:#152421}.t{font:700 17px system-ui,sans-serif;fill:#152421}.s{font:14px system-ui,sans-serif;fill:#5d6864}.e{font:800 15px system-ui,sans-serif;letter-spacing:2px;fill:#a73d2c}</style></defs><rect class="bg" width="1200" height="800" rx="28"/><text x="55" y="58" class="e">A PREDICTIVE MODEL IS ONLY ONE COMPONENT OF A HAPTIC SYSTEM</text><g transform="translate(35 100)"><rect class="p" x="0" width="155" height="150" rx="19"/><text x="78" y="42" text-anchor="middle" class="t">Interaction data</text><text x="78" y="76" text-anchor="middle" class="s">force · motion</text><text x="78" y="100" text-anchor="middle" class="s">images · audio</text><text x="78" y="124" text-anchor="middle" class="s">human ratings</text><path class="line" d="M165 75h25"/><rect class="b" x="200" width="155" height="150" rx="19"/><text x="278" y="42" text-anchor="middle" class="t">Representation</text><text x="278" y="76" text-anchor="middle" class="s">states · features</text><text x="278" y="100" text-anchor="middle" class="s">spectra · sequences</text><text x="278" y="124" text-anchor="middle" class="s">latent variables</text><path class="line" d="M365 75h25"/><rect class="g" x="400" width="155" height="150" rx="19"/><text x="478" y="42" text-anchor="middle" class="t">Model</text><text x="478" y="76" text-anchor="middle" class="s">physics</text><text x="478" y="100" text-anchor="middle" class="s">regression / ML</text><text x="478" y="124" text-anchor="middle" class="s">hybrid system</text><path class="line" d="M565 75h25"/><rect class="r" x="600" width="155" height="150" rx="19"/><text x="678" y="42" text-anchor="middle" class="t">Real-time policy</text><text x="678" y="76" text-anchor="middle" class="s">condition on state</text><text x="678" y="100" text-anchor="middle" class="s">schedule cues</text><text x="678" y="124" text-anchor="middle" class="s">respect latency</text><path class="line" d="M765 75h25"/><rect class="a" x="800" width="155" height="150" rx="19"/><text x="878" y="42" text-anchor="middle" class="t">Device output</text><text x="878" y="76" text-anchor="middle" class="s">force · vibration</text><text x="878" y="100" text-anchor="middle" class="s">pressure · heat</text><text x="878" y="124" text-anchor="middle" class="s">measured at body</text><path class="line" d="M965 75h25"/><rect class="p" x="1000" width="165" height="150" rx="19"/><text x="1082" y="42" text-anchor="middle" class="t">Human outcome</text><text x="1082" y="76" text-anchor="middle" class="s">perceptual match</text><text x="1082" y="100" text-anchor="middle" class="s">task benefit</text><text x="1082" y="124" text-anchor="middle" class="s">comfort + trust</text></g><text x="60" y="330" class="h">Evaluation must prevent leakage and test the intended generalization</text><g transform="translate(60 370)"><rect class="g" x="0" width="310" height="250" rx="22"/><text x="25" y="43" class="t">Training set</text><text x="25" y="78" class="s">Used to fit parameters.</text><text x="25" y="108" class="s">May include augmentation and</text><text x="25" y="132" class="s">cross-validation inside training.</text><text x="25" y="180" class="t">Examples</text><text x="25" y="208" class="s">objects A–H · participants 1–20</text><rect class="b" x="355" width="310" height="250" rx="22"/><text x="380" y="43" class="t">Validation set</text><text x="380" y="78" class="s">Used for model and hyperparameter</text><text x="380" y="102" class="s">selection, not final performance.</text><text x="380" y="180" class="t">Question</text><text x="380" y="208" class="s">Which model should be retained?</text><rect class="r" x="710" width="430" height="250" rx="22"/><text x="735" y="43" class="t">Held-out test + human validation</text><text x="735" y="78" class="s">Never used during fitting or selection.</text><text x="735" y="112" class="s">Test the actual claim:</text><text x="735" y="140" class="s">new trials, new objects, new people,</text><text x="735" y="164" class="s">new devices, or new contexts.</text><text x="735" y="208" class="t">Final question</text><text x="735" y="234" class="s">Does the rendered result work for users?</text><path class="bad" d="M310 170c70 80 290 80 400 5"/><text x="505" y="240" text-anchor="middle" class="s">Do not tune on the test set</text></g><rect class="p" x="150" y="670" width="900" height="75" rx="18"/><text x="600" y="701" text-anchor="middle" class="t">Report uncertainty, baselines, ablations, failure cases, runtime, and the exact split unit.</text><text x="600" y="727" text-anchor="middle" class="s">Randomly splitting windows from the same object or participant can produce misleadingly optimistic results.</text></svg>