<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Haptic rendering and control architecture</title><desc id="desc">A user and device interact through a fast haptic servo loop, while a slower graphics and simulation loop updates scene state. Insets compare impedance and admittance control and illustrate a proxy constrained to a virtual surface.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#215f5a"/></marker><style>.bg{fill:#fffdf8}.p{fill:#f5f2ea;stroke:#c9c7be;stroke-width:2}.g{fill:#dce7df;stroke:#215f5a;stroke-width:2}.r{fill:#f3d8cf;stroke:#a73d2c;stroke-width:2}.b{fill:#dbe6ee;stroke:#40677a;stroke-width:2}.line{stroke:#215f5a;stroke-width:4;fill:none;marker-end:url(#a)}.fast{stroke:#a73d2c;stroke-width:5;fill:none;marker-end:url(#a)}.wall{stroke:#152421;stroke-width:9}.dash{stroke:#40677a;stroke-width:3;stroke-dasharray:8 7}.h{font:700 27px Georgia,serif;fill:#152421}.t{font:700 18px system-ui,sans-serif;fill:#152421}.s{font:14px system-ui,sans-serif;fill:#5d6864}.e{font:800 15px system-ui,sans-serif;letter-spacing:2px;fill:#a73d2c}</style></defs><rect class="bg" width="1200" height="780" rx="28"/><text x="55" y="58" class="e">HAPTIC SYSTEMS COUPLE FAST PHYSICAL CONTROL TO SLOWER SCENE UPDATES</text><g transform="translate(55 100)"><rect class="r" x="0" y="75" width="150" height="120" rx="20"/><text x="75" y="122" text-anchor="middle" class="t">User + body</text><text x="75" y="151" text-anchor="middle" class="s">motion and force</text><path class="fast" d="M160 112h55"/><path class="fast" d="M215 162h-55"/><rect class="g" x="225" y="55" width="185" height="160" rx="20"/><text x="318" y="105" text-anchor="middle" class="t">Haptic device</text><text x="318" y="134" text-anchor="middle" class="s">sensors + actuators</text><text x="318" y="171" text-anchor="middle" class="s">mechanical dynamics</text><path class="fast" d="M420 95h60"/><path class="fast" d="M480 175h-60"/><rect class="r" x="490" y="35" width="225" height="200" rx="20"/><text x="603" y="82" text-anchor="middle" class="t">Haptic servo loop</text><text x="603" y="112" text-anchor="middle" class="s">read state</text><text x="603" y="137" text-anchor="middle" class="s">detect contact / update proxy</text><text x="603" y="162" text-anchor="middle" class="s">compute force</text><text x="603" y="187" text-anchor="middle" class="s">send actuator command</text><text x="603" y="216" text-anchor="middle" class="t">high update rate</text><path class="line" d="M725 135h70"/><rect class="b" x="805" y="55" width="215" height="160" rx="20"/><text x="912" y="105" text-anchor="middle" class="t">World model</text><text x="912" y="134" text-anchor="middle" class="s">geometry + dynamics</text><text x="912" y="162" text-anchor="middle" class="s">remote or virtual state</text><path class="line" d="M912 225v55"/><rect class="p" x="805" y="290" width="215" height="105" rx="20"/><text x="912" y="334" text-anchor="middle" class="t">Graphics / application</text><text x="912" y="363" text-anchor="middle" class="s">lower-rate visual update</text></g><g transform="translate(55 520)"><rect class="p" width="330" height="190" rx="22"/><text x="25" y="43" class="h">Impedance</text><text x="25" y="82" class="s">Input: measured motion</text><text x="25" y="109" class="s">Output: commanded force</text><text x="25" y="148" class="t">F = f(x, v, state)</text><rect class="g" x="375" width="330" height="190" rx="22"/><text x="400" y="43" class="h">Admittance</text><text x="400" y="82" class="s">Input: measured force</text><text x="400" y="109" class="s">Output: commanded motion</text><text x="400" y="148" class="t">x = g(F, state)</text><rect class="r" x="750" width="390" height="190" rx="22"/><text x="775" y="43" class="h">Proxy / god-object</text><line class="wall" x1="965" y1="65" x2="965" y2="165"/><circle cx="1030" cy="112" r="17" fill="#d95d45"/><circle cx="940" cy="112" r="17" fill="#215f5a"/><line class="dash" x1="957" y1="112" x2="1013" y2="112"/><text x="775" y="87" class="s">Device point may penetrate</text><text x="775" y="111" class="s">the virtual surface; the proxy</text><text x="775" y="135" class="s">remains constrained and defines</text><text x="775" y="159" class="s">a stable contact response.</text></g><text x="600" y="750" text-anchor="middle" class="s">Stability and transparency depend on sampling, delay, quantization, damping, device dynamics, and the rendered environment.</text></svg>