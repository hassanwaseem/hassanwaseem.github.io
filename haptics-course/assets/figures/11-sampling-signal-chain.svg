<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Signal generation measurement and sampling in haptics</title><desc id="desc">A continuous target waveform passes through command generation, digital-to-analog conversion, actuator mechanics, the body interface, sensing, analog filtering, sampling, and analysis. A lower plot contrasts adequate sampling with aliasing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#215f5a"/></marker><style>.bg{fill:#fffdf8}.p{fill:#f5f2ea;stroke:#c9c7be;stroke-width:2}.g{fill:#dce7df;stroke:#215f5a;stroke-width:2}.r{fill:#f3d8cf;stroke:#a73d2c;stroke-width:2}.line{stroke:#215f5a;stroke-width:4;fill:none;marker-end:url(#a)}.wave{stroke:#a73d2c;stroke-width:5;fill:none}.sample{fill:#215f5a}.axis{stroke:#152421;stroke-width:3}.h{font:700 27px Georgia,serif;fill:#152421}.t{font:700 18px system-ui,sans-serif;fill:#152421}.b{font:15px system-ui,sans-serif;fill:#5d6864}.e{font:800 15px system-ui,sans-serif;letter-spacing:2px;fill:#a73d2c}</style></defs><rect class="bg" width="1200" height="760" rx="28"/><text x="55" y="58" class="e">THE USER FEELS THE OUTPUT OF A COMPLETE SIGNAL CHAIN</text><g transform="translate(40 100)"><rect class="p" x="0" y="0" width="130" height="120" rx="18"/><text x="65" y="45" text-anchor="middle" class="t">Target</text><path class="wave" d="M18 82c18-40 34 40 52 0s34 40 52 0"/><path class="line" d="M140 60h25"/><rect class="p" x="175" width="130" height="120" rx="18"/><text x="240" y="45" text-anchor="middle" class="t">Digital</text><text x="240" y="70" text-anchor="middle" class="b">command</text><path class="line" d="M315 60h25"/><rect class="g" x="350" width="130" height="120" rx="18"/><text x="415" y="45" text-anchor="middle" class="t">Actuator</text><text x="415" y="70" text-anchor="middle" class="b">dynamics</text><path class="line" d="M490 60h25"/><rect class="r" x="525" width="130" height="120" rx="18"/><text x="590" y="45" text-anchor="middle" class="t">Body</text><text x="590" y="70" text-anchor="middle" class="b">interface</text><path class="line" d="M665 60h25"/><rect class="p" x="700" width="130" height="120" rx="18"/><text x="765" y="45" text-anchor="middle" class="t">Sensor</text><text x="765" y="70" text-anchor="middle" class="b">and filter</text><path class="line" d="M840 60h25"/><rect class="g" x="875" width="130" height="120" rx="18"/><text x="940" y="45" text-anchor="middle" class="t">Sampling</text><text x="940" y="70" text-anchor="middle" class="b">ADC + clock</text><path class="line" d="M1015 60h25"/><rect class="p" x="1050" width="110" height="120" rx="18"/><text x="1105" y="45" text-anchor="middle" class="t">Analysis</text><text x="1105" y="70" text-anchor="middle" class="b">time + spectrum</text></g><text x="60" y="290" class="h">Sampling determines which temporal structure can be recovered</text><g transform="translate(70 335)"><rect class="g" width="500" height="330" rx="22"/><text x="25" y="42" class="t">Adequate sampling</text><line class="axis" x1="45" y1="270" x2="455" y2="270"/><line class="axis" x1="45" y1="270" x2="45" y2="70"/><path class="wave" d="M45 170c35-100 70 100 105 0s70 100 105 0 70 100 105 0 70 100 95 5"/><g class="sample"><circle cx="45" cy="170" r="6"/><circle cx="80" cy="82" r="6"/><circle cx="115" cy="170" r="6"/><circle cx="150" cy="258" r="6"/><circle cx="185" cy="170" r="6"/><circle cx="220" cy="82" r="6"/><circle cx="255" cy="170" r="6"/><circle cx="290" cy="258" r="6"/><circle cx="325" cy="170" r="6"/><circle cx="360" cy="82" r="6"/><circle cx="395" cy="170" r="6"/><circle cx="430" cy="258" r="6"/></g><text x="25" y="310" class="b">Samples reveal the oscillation and support reconstruction.</text><rect class="r" x="560" width="500" height="330" rx="22"/><text x="585" y="42" class="t">Aliasing</text><line class="axis" x1="605" y1="270" x2="1015" y2="270"/><line class="axis" x1="605" y1="270" x2="605" y2="70"/><path class="wave" d="M605 170c35-100 70 100 105 0s70 100 105 0 70 100 105 0 70 100 95 5" opacity=".45"/><path d="M605 170c95-65 190-65 285 0s95 65 125 35" stroke="#215f5a" stroke-width="6" fill="none"/><g class="sample"><circle cx="605" cy="170" r="7"/><circle cx="700" cy="105" r="7"/><circle cx="795" cy="105" r="7"/><circle cx="890" cy="170" r="7"/><circle cx="985" cy="235" r="7"/></g><text x="585" y="310" class="b">Sparse samples falsely suggest a slower waveform.</text></g><text x="600" y="720" text-anchor="middle" class="b">Anti-alias filtering must occur before sampling; filtering after aliasing cannot recover the lost information.</text></svg>