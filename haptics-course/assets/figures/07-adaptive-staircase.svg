<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">How an adaptive staircase concentrates trials near a threshold</title>
  <desc id="desc">A trial-by-trial plot shows stimulus level decreasing after correct responses and increasing after errors. Reversals are marked, step size becomes smaller, and later trials cluster near a target level.</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.axis{stroke:#152421;stroke-width:4}.grid{stroke:#c9c7be;stroke-width:1.5;stroke-dasharray:7 7}.path{stroke:#215f5a;stroke-width:6;fill:none;stroke-linejoin:round}.rev{fill:#d95d45;stroke:#fffdf8;stroke-width:3}.correct{fill:#215f5a}.error{fill:#a73d2c}.target{stroke:#d2a75f;stroke-width:4;stroke-dasharray:12 8}.label{font:17px system-ui,sans-serif;fill:#5d6864}.title{font:700 21px system-ui,sans-serif;fill:#152421}.eyebrow{font:800 16px system-ui,sans-serif;letter-spacing:2px;fill:#a73d2c}.note{fill:#f5f2ea;stroke:#c9c7be;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1200" height="700" rx="28"/>
  <text x="55" y="58" class="eyebrow">ADAPTIVE METHODS SPEND MORE TRIALS WHERE THE ANSWER IS UNCERTAIN</text>
  <g transform="translate(125 110)">
    <line class="axis" x1="0" y1="450" x2="920" y2="450"/>
    <line class="axis" x1="0" y1="450" x2="0" y2="0"/>
    <line class="grid" x1="0" y1="90" x2="920" y2="90"/>
    <line class="grid" x1="0" y1="180" x2="920" y2="180"/>
    <line class="grid" x1="0" y1="270" x2="920" y2="270"/>
    <line class="grid" x1="0" y1="360" x2="920" y2="360"/>
    <line class="target" x1="0" y1="305" x2="920" y2="305"/>
    <text x="930" y="311" class="label">target region</text>
    <polyline class="path" points="0,70 60,110 120,150 180,190 240,150 300,190 360,230 420,270 480,230 540,270 600,310 660,290 720,310 780,290 840,310 900,300"/>
    <circle class="rev" cx="240" cy="150" r="10"/><circle class="rev" cx="480" cy="230" r="10"/><circle class="rev" cx="660" cy="290" r="10"/><circle class="rev" cx="720" cy="310" r="10"/><circle class="rev" cx="780" cy="290" r="10"/><circle class="rev" cx="840" cy="310" r="10"/>
    <text x="240" y="128" text-anchor="middle" class="label">reversal</text>
    <text x="480" y="208" text-anchor="middle" class="label">reversal</text>
    <text x="660" y="265" text-anchor="middle" class="label">smaller steps</text>
    <g transform="translate(40 490)"><circle class="correct" cx="0" cy="0" r="8"/><text x="18" y="6" class="label">correct response makes the task harder</text></g>
    <g transform="translate(470 490)"><circle class="error" cx="0" cy="0" r="8"/><text x="18" y="6" class="label">error makes the task easier</text></g>
    <text x="450" y="555" text-anchor="middle" class="title">Trial number</text>
    <text x="-80" y="225" transform="rotate(-90 -80 225)" text-anchor="middle" class="title">Stimulus level</text>
  </g>
  <rect class="note" x="135" y="630" width="930" height="45" rx="14"/>
  <text x="600" y="658" text-anchor="middle" class="label">The convergence point depends on the up–down rule, step sizes, lapse behaviour, stopping rule, and model assumptions.</text>
</svg>